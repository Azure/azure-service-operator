typeFilters:
  - action: include
    version: v*20200801preview
    because: We want to export this particular preview version
groupModelConfiguration:
  2020-10-01:
    RoleEligibilityScheduleRequest:
      $exportAs: RoleEligibilityScheduleRequest
      $supportedFrom: v2.22.0
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any request without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleEligibilityScheduleRequestProperties:
      PrincipalId:
        $importConfigMapMode: optional
      RoleDefinitionId:
        $description: The role definition ID. This can be the ARM ID of a custom role definition, or the well-known name of a built-in role definition. See https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles for well-known role definition names.
        $referenceType: arm+wellknown
        # Note that while there are fields TargetRoleEligibilityScheduleId and TargetRoleEligibilityScheduleInstanceId which
        # are definitely at least sometimes ARM IDs (see the test recordings for this resource), but according to this sample: 
        # https://github.com/Azure/azure-rest-api-specs/blob/main/specification/authorization/resource-manager/Microsoft.Authorization/Authorization/stable/2020-10-01/examples/PutRoleEligibilityScheduleRequest.json
        # they are also sometimes UUIDs. Not forcing them to ARM ID at this point due to the above.
  2020-08-01-preview:
    RoleAssignment:
      $exportAs: RoleAssignment
      $supportedFrom: v2.0.0-alpha.2
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any role without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleAssignmentProperties:
      DelegatedManagedIdentityResourceId:
        $referenceType: arm
      RoleDefinitionId:
        $description: The role definition ID. This can be the ARM ID of a custom role definition, or the well-known name of a built-in role definition. See https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles for well-known role definition names.
        $referenceType: arm+wellknown
      PrincipalId:
        $importConfigMapMode: optional
  2022-04-01:
    RoleAssignment:
      $exportAs: RoleAssignment
      $supportedFrom: v2.4.0
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any role without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleAssignmentProperties:
      DelegatedManagedIdentityResourceId:
        $referenceType: arm
      RoleDefinitionId:
        $description: The role definition ID. This can be the ARM ID of a custom role definition, or the well-known name of a built-in role definition. See https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles for well-known role definition names.
        $referenceType: arm+wellknown
      PrincipalId:
        $importConfigMapMode: optional
    RoleDefinition:
      $exportAs: RoleDefinition
      $supportedFrom: v2.8.0
      $defaultAzureName: false
      $operatorSpecProperties:
        - name: NamingConvention
          type: string
          description: The uuid generation technique to use for any role without an explicit AzureName. One of 'stable' or 'random'. <br> +kubebuilder:validation:Enum={"random","stable"}
    RoleDefinitionProperties:
      AssignableScopes:
        $referenceType: arm
