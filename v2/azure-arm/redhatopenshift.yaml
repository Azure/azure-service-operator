typeTransformers:
  - name: OpenShiftClusterProperties
    property: ProvisioningState
    remove: true
    because: This property should be marked readonly in Swagger

groupModelConfiguration:
  2023-11-22:
    OpenShiftCluster:
      $exportAs: OpenShiftCluster
      $supportedFrom: v2.9.0
      $azureGeneratedSecrets:
        - AdminCredentials
        - Username
        - Password
    WorkerProfile:
      SubnetId:
        $referenceType: arm
      DiskEncryptionSetId:
        $referenceType: arm
    MasterProfile:
      SubnetId:
        $referenceType: arm
      DiskEncryptionSetId:
        $referenceType: arm
    ClusterProfile:
      PullSecret:
        $importSecretMode: required
    ServicePrincipalProfile:
      ClientSecret:
        $importSecretMode: required
      ClientId:
        $importConfigMapMode: optional
  # HCP GA added activeVersions to the cluster and node-pool status schemas.
  # The manual augment conversions preserve that field in the preview status property bag,
  # which does not model it directly.
  2026-09-01-preview:
    HcpOpenShiftClusterProperties_STATUS:
      Status:
        $conversionStrategy: manual
    NodePoolProperties_STATUS:
      Status:
        $conversionStrategy: manual
    ExternalAuthProperties_STATUS:
      Status:
        $conversionStrategy: manual
    HcpOpenShiftClusters_NodePool:
      $supportedFrom: v2.23.0
      $exportAs: HcpOpenShiftClustersNodePool
    HcpOpenShiftClusters_ExternalAuth:
      $supportedFrom: v2.23.0
      $exportAs: HcpOpenShiftClustersExternalAuth
    HcpOpenShiftCluster:
      $exportAs: HcpOpenShiftCluster
      $supportedFrom: v2.23.0
      $azureGeneratedSecrets:
        - AdminCredentials
    KmsKey:
      Name:
        $importConfigMapMode: optional
      Version:
        $importConfigMapMode: optional
    # Configure references for complex types
    NodePoolVersionProfile:
      Id:
        $referenceType: simple
    VersionProfile:
      Id:
        $referenceType: simple
  2026-10-01:
    HcpOpenShiftClusterProperties_STATUS:
      Status:
        $conversionStrategy: manual
    NodePoolProperties_STATUS:
      Status:
        $conversionStrategy: manual
    ExternalAuthProperties_STATUS:
      Status:
        $conversionStrategy: manual
    HcpOpenShiftClusters_NodePool:
      $supportedFrom: v2.23.0
      $exportAs: HcpOpenShiftClustersNodePool
    HcpOpenShiftClusters_ExternalAuth:
      $supportedFrom: v2.23.0
      $exportAs: HcpOpenShiftClustersExternalAuth
    HcpOpenShiftCluster:
      $exportAs: HcpOpenShiftCluster
      $supportedFrom: v2.23.0
      $azureGeneratedSecrets:
        - AdminCredentials
    KmsKey:
      Name:
        $importConfigMapMode: optional
      Version:
        $importConfigMapMode: optional
    # Configure references for complex types
    NodePoolVersionProfile:
      Id:
        $referenceType: simple
    VersionProfile:
      Id:
        $referenceType: simple
