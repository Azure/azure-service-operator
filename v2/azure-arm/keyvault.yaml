typeFilters:
  - action: include
    version: v*20210401preview
    because: We want to support keyvault which is only available in preview version

typeTransformers:
  #
  # In the group 'keyvault',
  # on the types 'VaultProperties_CreateMode` and 'VaultProperties_CreateMode_STATUS'
  # redefine the property 'CreateMode' to be an enum with four values
  #
  - name: VaultProperties_CreateMode;VaultProperties_CreateMode_STATUS
    target:
      enum:
        base: string
        values:
          - default
          - recover
          - createOrRecover
          - purgeThenCreate
    because: "We're adding two new options to allow KeyVaults to goal-seek"

groupModelConfiguration:
  2021-04-01-preview:
    Vault:
      $exportAs: Vault
      $supportedFrom: v2.0.0-beta.1
    VaultProperties:
      TenantId:
        $importConfigMapMode: optional
    AccessPolicyEntry:
      TenantId:
        $importConfigMapMode: optional
      ApplicationId:
        $importConfigMapMode: optional
      ObjectId:
        $importConfigMapMode: optional
    VirtualNetworkRule:
      Id:
        $referenceType: arm
  2023-07-01:
    Vault:
      $exportAs: Vault
      $supportedFrom: v2.5.0
    Vaults_Key:
      $exportAs: VaultKey
      $supportedFrom: v2.22.0
      # VaultKey is generation-only: asoctl import is deliberately unsupported. The generated
      # Initialize_From function could only round-trip tags (spec.properties is required but not
      # recoverable from status in a form that preserves the generation-only contract), so an
      # import would produce an unappliable resource. Better to skip the resource explicitly.
      $importable: false
      $operatorSpecProperties:
        - name: CreateMode
          type: string
          description: Specifies how the operator handles a soft-deleted key occupying the requested name at creation time. 'default' issues a plain create and surfaces the Azure conflict error if a soft-deleted key blocks the name; 'recover' recovers the soft-deleted key and fails when none exists; 'createOrRecover' recovers a soft-deleted key when one exists and otherwise creates a new key; 'purgeThenCreate' permanently purges the soft-deleted key before creating a replacement. Defaults to 'default'. <br> +kubebuilder:validation:Enum={"default","recover","createOrRecover","purgeThenCreate"}
        - name: DeleteMode
          type: string
          description: Specifies what happens to the key in Azure when the VaultKey resource is deleted from Kubernetes. 'detach' leaves the key untouched in the vault; 'delete' soft-deletes the key via the Key Vault data plane; 'disable' sets the key's enabled attribute to false and leaves it in the vault. Defaults to 'detach', which preserves the key. <br> +kubebuilder:validation:Enum={"detach","delete","disable"}
    VaultProperties:
      TenantId:
        $importConfigMapMode: optional
    AccessPolicyEntry:
      TenantId:
        $importConfigMapMode: optional
      ApplicationId:
        $importConfigMapMode: optional
      ObjectId:
        $importConfigMapMode: optional
    VirtualNetworkRule:
      Id:
        $referenceType: arm
