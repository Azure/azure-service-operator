{{- if and (eq .Values.workloadIdentityAuthMode "strict") (or (eq .Values.multitenant.enable false) (eq .Values.azureOperatorMode "watchers")) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- if not .Values.multitenant.enable }}
  name: azureserviceoperator-workload-identity-token-creator-rolebinding
  {{ else }}
  name: azureserviceoperator-workload-identity-token-creator-rolebinding-{{ .Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azureserviceoperator-workload-identity-token-creator-role
subjects:
- kind: ServiceAccount
  name: {{ include "azure-service-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
