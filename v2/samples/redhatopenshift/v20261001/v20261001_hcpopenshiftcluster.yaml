        - reference:
          group: managedidentity.azure.com
          kind: UserAssignedIdentity
          name: aso-sample-cp-control-plane
        - reference:
          group: managedidentity.azure.com
          kind: UserAssignedIdentity
          name: aso-sample-cp-disk-csi-driver
        - reference:
          group: managedidentity.azure.com
