# VaultKey manages an RSA key inside an existing Key Vault (Microsoft.KeyVault/vaults/keys).
# Key Vault generates the material; kty, keySize and curveName are fixed once created, while the
# other properties are applied through the Key Vault data plane. operatorSpec.createMode and
# deleteMode choose how soft-deleted name collisions and resource deletion are handled.
# See docs/hugo/content/guide/keyvaults.md for the details.
apiVersion: keyvault.azure.com/v20230701
kind: VaultKey
metadata:
  name: samplevaultkey
  namespace: default
spec:
  owner:
    name: samplevault
  operatorSpec:
    createMode: createOrRecover # recover a soft-deleted key of this name, otherwise create
    deleteMode: detach # leave the key in the vault when this resource is deleted (the default)
  properties:
    kty: RSA
    keySize: 2048
    keyOps:
      - sign
      - verify
      - wrapKey
      - unwrapKey
    attributes:
      enabled: true
      exportable: false # true is rejected by the validating webhook
    rotationPolicy:
      attributes:
        # New key versions expire after two years; the notify and rotate triggers below are
        # relative to that expiry and to the creation date.
        expiryTime: P2Y
      lifetimeActions:
        - action:
            type: notify
          trigger:
            # Notify 30 days before the key's expiry date.
            timeBeforeExpiry: P30D
        - action:
            type: rotate
          trigger:
            # Rotate the key 90 days after it was created.
            timeAfterCreate: P90D
  tags:
    team: identity
    environment: sample
