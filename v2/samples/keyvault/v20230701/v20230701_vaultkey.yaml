# VaultKey manages an RSA cryptographic key inside an existing Key Vault
# (Microsoft.KeyVault/vaults/keys).
#
# IMPORTANT - please read before using this resource:
#
# 1. Generation-only: Azure Key Vault generates the key material itself when this
#    resource is created. There is no field on this resource (and none in the underlying
#    ARM API) through which key material can be supplied - this resource cannot be used to
#    import an existing key. Private key material never transits the Kubernetes cluster,
#    this CR, or any Secret.
#
# 2. Generation-time properties are immutable: kty, keySize and curveName are fixed when the
#    key material is generated, and a validating webhook rejects any attempt to change them.
#    The remaining properties (keyOps, attributes, release_policy, rotationPolicy) and
#    spec.tags are mutable: ASO applies changes to them through the Key Vault data plane.
#    Properties the spec leaves unset are not managed and keep their value in Azure.
#
# 3. Deletion behaviour is chosen via spec.operatorSpec.deleteMode: 'detach' (the default)
#    leaves the key untouched in the vault, 'disable' sets enabled=false and leaves it,
#    'delete' soft-deletes it via the data plane (recoverable for the vault's retention
#    period; ASO never purges a key on deletion). A reconcile-policy of detach-on-delete or
#    skip (object, namespace, or operator-wide) takes precedence over deleteMode.
#
# 4. Existing keys are adopted by name, provided kty/keySize/curveName match the real key;
#    spec.operatorSpec.createMode ('default', 'recover', 'createOrRecover',
#    'purgeThenCreate') controls goal-seeking around soft-deleted name collisions, exactly
#    like Vault's createMode.
apiVersion: keyvault.azure.com/v20230701
kind: VaultKey
metadata:
  name: samplevaultkey
  namespace: default
spec:
  owner:
    name: samplevault
  operatorSpec:
    # Recover a soft-deleted key with this name if one exists, otherwise create a new key.
    createMode: createOrRecover
    # Leave the key in the vault when this resource is deleted (this is the default).
    deleteMode: detach
  properties:
    kty: RSA
    keySize: 2048
    keyOps:
      - sign
      - verify
      - wrapKey
      - unwrapKey
    attributes:
      enabled: true
      # exportable must be false (or omitted) - true is unconditionally rejected by the
      # validating webhook for this resource.
      exportable: false
    rotationPolicy:
      lifetimeActions:
        - action:
            type: notify
          trigger:
            # Notify 30 days before the key's expiry date.
            timeBeforeExpiry: P30D
        - action:
            type: rotate
          trigger:
            # Rotate the key 90 days after it was created.
            timeAfterCreate: P90D
  tags:
    team: identity
    environment: sample
