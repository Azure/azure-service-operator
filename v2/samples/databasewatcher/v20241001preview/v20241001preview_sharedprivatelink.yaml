apiVersion: databasewatcher.azure.com/v20241001preview
kind: SharedPrivateLink
metadata:
  name: aso-sample-sharedprivatelink
  namespace: default
spec:
  owner:
    name: aso-sample-watcher
  groupId: sqlServer
  # dnsZone is required for Azure Data Explorer clusters and SQL managed instances, and must be
  # omitted for SQL logical servers and key vaults, as here
  requestMessage: Please approve the connection from the database watcher
  # Naming the resource as a Kubernetes resource, rather than by ARM ID, lets the operator approve the
  # private endpoint connection this link opens on it
  privateLinkResourceReference:
    group: sql.azure.com
    kind: Server
    name: asotestdbwserver
