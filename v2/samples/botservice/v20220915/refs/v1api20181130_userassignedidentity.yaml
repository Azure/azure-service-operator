apiVersion: managedidentity.azure.com/v1api20181130
kind: UserAssignedIdentity
metadata:
  name: aso-sample-botidentity
  namespace: default
spec:
  location: westus2
  owner:
    name: aso-sample-rg
  operatorSpec:
    configMaps:
      tenantId:
        name: aso-sample-botidentity-settings
        key: tenantId
      clientId:
        name: aso-sample-botidentity-settings
        key: clientId
