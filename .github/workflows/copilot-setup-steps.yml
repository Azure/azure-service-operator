name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned to 7.0.1
        with:
          fetch-depth: 0 # required to access tags
          submodules: 'true'

      # Copilot cleans the checkout before reviewing fork PRs, so keep tools outside it.
      - name: Install Dependencies
        run: sudo env ASO_TOOL_DEST="$RUNNER_TEMP/aso-tools" .devcontainer/install-dependencies.sh --skip-installed

      - name: Make installed tools writable by the runner
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/aso-tools"

      - name: Set custom PATH
        run: echo "PATH=$PATH:$RUNNER_TEMP/aso-tools" >> "$GITHUB_ENV"
