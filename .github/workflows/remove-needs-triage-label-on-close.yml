name: Remove needs-triage label on issue close

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  remove-needs-triage-label:
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # pinned to v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_ID }}
          private-key: ${{ secrets.AUTOMATION_KEY }}

      - name: Remove needs-triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned to v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const label = "needs-triage :mag:";
            const hasLabel = context.payload.issue.labels.some(
              issueLabel => issueLabel.name === label
            );

            if (hasLabel) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name: label
              });
            }
