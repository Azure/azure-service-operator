name: Add external contribution label

on:
  # pull_request_target can access secrets and a write-enabled GITHUB_TOKEN,
  # even for fork PRs. Keep this workflow metadata-only: never check out or
  # execute PR-controlled code, or interpolate PR text into executable scripts.
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  label-external-contribution:
    if: >-
      github.event.pull_request.user.type == 'User' &&
      !contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # PR labels use the issues API but require pull request permissions.
    steps:
      - name: Add external contribution label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # pinned to v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: ["external contribution"]
            });
